# Codemagic CI/CD for Azkroh (Shorebird code push).
#
# One-time setup in Codemagic (Team → Global variables & secrets / Code signing):
#   • Group "shorebird":   SHOREBIRD_TOKEN  (Shorebird Console → Settings →
#                          Service accounts → Create key; mark Secure)
#   • Group "play_store":  GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Google Play
#                          service account JSON; mark Secure)
#   • Android keystore:    upload android/upload-keystore.jks with the
#                          reference name "azkroh_keystore"
#   • App Store Connect:   Team integrations → Developer Portal → add an
#                          API key named "Azkroh ASC"
#
# Workflows (all started manually from Codemagic):
#   android-release / ios-release  → new Shorebird release + store upload
#   android-patch   / ios-patch    → Shorebird patch for an existing release

definitions:
  env_versions: &env_versions
    flutter: 3.41.6
    xcode: 26.3          # keep the same Xcode for an iOS release and its patches
    cocoapods: 1.16.2
  vars: &vars
    FLUTTER_VERSION: 3.41.6
    BUNDLE_ID: com.islamsalemco.azkroh
    PACKAGE_NAME: com.islamsalemco.azkroh
    APP_STORE_APPLE_ID: 6755852829

  scripts:
    - &shorebird_install
      name: Install Shorebird
      script: |
        curl -fsSL https://shorebird.dev/install.sh | bash
        echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
    - &pub_get
      name: Get packages
      script: flutter pub get
    - &ios_signing_files
      # Certificates/profiles come from ios_signing + the App Store Connect
      # integration; this writes /Users/builder/export_options.plist.
      name: iOS code signing
      script: |
        xcode-project use-profiles --custom-export-options={\"manageAppVersionAndBuildNumber\":false}

workflows:
  android-release:
    name: Android release (Shorebird → Play internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env_versions
      groups:
        - shorebird
        - play_store
      vars:
        <<: *vars
      android_signing:
        - azkroh_keystore
    scripts:
      - *shorebird_install
      - *pub_get
      - name: Shorebird release (Android)
        script: |
          shorebird release android \
            --flutter-version="$FLUTTER_VERSION"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS release (Shorebird → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Azkroh ASC
    environment:
      <<: *env_versions
      groups:
        - shorebird
      vars:
        <<: *vars
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.islamsalemco.azkroh
    scripts:
      - *shorebird_install
      - *pub_get
      - *ios_signing_files
      - name: Shorebird release (iOS)
        script: |
          shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-patch:
    name: Android patch (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 60
    inputs:
      release_version:
        description: Release version to patch (e.g. 1.1.3+25)
    environment:
      <<: *env_versions
      groups:
        - shorebird
      vars:
        <<: *vars
      android_signing:
        - azkroh_keystore
    scripts:
      - *shorebird_install
      - *pub_get
      - name: Shorebird patch (Android)
        script: |
          shorebird patch android \
            --release-version=${{ inputs.release_version }} \
            --track=stable

  ios-patch:
    name: iOS patch (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Azkroh ASC
    inputs:
      release_version:
        description: Release version to patch (e.g. 1.1.3+25)
    environment:
      <<: *env_versions
      groups:
        - shorebird
      vars:
        <<: *vars
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.islamsalemco.azkroh
    scripts:
      - *shorebird_install
      - *pub_get
      - *ios_signing_files
      - name: Shorebird patch (iOS)
        script: |
          shorebird patch ios \
            --release-version=${{ inputs.release_version }} \
            --track=stable \
            --export-options-plist=/Users/builder/export_options.plist

  # ---------------------------------------------------------------------------
  # Automatic (tag-triggered): Android + iOS in one build
  #   git tag release-1.1.3+25 && git push origin release-1.1.3+25
  #   git tag patch-1.1.3+25   && git push origin patch-1.1.3+25
  # A plain push does nothing.
  # ---------------------------------------------------------------------------
  release-all:
    name: Release Android + iOS (tag release-*)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Azkroh ASC
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'release-*'
          include: true
      cancel_previous_builds: false
    environment:
      <<: *env_versions
      groups:
        - shorebird
        - play_store
      vars:
        <<: *vars
      android_signing:
        - azkroh_keystore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.islamsalemco.azkroh
    scripts:
      - *shorebird_install
      - *pub_get
      - *ios_signing_files
      - name: Check tag matches pubspec version
        script: |
          TAG_VERSION="${CM_TAG#release-}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag $CM_TAG does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi
      - name: Shorebird release (Android)
        script: shorebird release android --flutter-version="$FLUTTER_VERSION"
      - name: Shorebird release (iOS)
        script: |
          shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - build/ios/ipa/*.ipa
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  patch-all:
    name: Patch Android + iOS (tag patch-*)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Azkroh ASC
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'patch-*'
          include: true
      cancel_previous_builds: false
    environment:
      <<: *env_versions
      groups:
        - shorebird
      vars:
        <<: *vars
      android_signing:
        - azkroh_keystore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.islamsalemco.azkroh
    scripts:
      - *shorebird_install
      - *pub_get
      - *ios_signing_files
      - name: Shorebird patch (Android + iOS)
        script: |
          # patch-1.1.5+27 (or a re-run on release-1.1.5+27) -> 1.1.5+27;
          # started without a tag -> the version in pubspec.yaml.
          RELEASE_VERSION="${CM_TAG#patch-}"
          RELEASE_VERSION="${RELEASE_VERSION#release-}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          fi
          echo "Patching release $RELEASE_VERSION"
          # CI can't answer Shorebird's prompts, so asset/native diffs are
          # allowed here. Patches only ever ship Dart code: before tagging a
          # patch make sure no native code changed since the release (plist
          # / manifest metadata is fine) and that new UI strings also exist
          # in Dart (lib/l10n/library_strings.dart), since assets don't ship.
          shorebird patch android --release-version="$RELEASE_VERSION" --track=stable \
            --allow-asset-diffs --allow-native-diffs
          shorebird patch ios --release-version="$RELEASE_VERSION" --track=stable \
            --allow-asset-diffs --allow-native-diffs \
            --export-options-plist=/Users/builder/export_options.plist
